version: 2

# Free on a public repo, and the point of this repo is that pinned things stay reviewed
# rather than stale. Both ecosystems matter: the Containerfile pins the runner base by
# digest, and the workflow pins each action.
updates:
  - package-ecosystem: docker
    directories:
      - /images/ci-runner-base
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
