version: 2

# Free on a public repo, and the point of this repo is that pinned things stay reviewed
# rather than stale. Both ecosystems matter: every Containerfile pins its FROM by digest
# (ci-runner-node pins the published ci-runner-base, not a local build — see
# .agents/gates.md), and the workflow pins each action. Watch every image directory here,
# not just the base, or a base digest bump never reaches the images built on top of it.
updates:
  - package-ecosystem: docker
    directories:
      - /images/ci-runner-base
      - /images/ci-runner-node
      - /images/ci-runner-muxwall
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
