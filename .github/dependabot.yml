version: 2

# Free on a public repo, and the point of this repo is that pinned things stay reviewed
# rather than stale. Both ecosystems matter: the Containerfile pins the runner base by
# digest, and the workflow pins each action.
updates:
  - package-ecosystem: docker
    directories:
      - /images/ci-runner-base
      # Its FROM pins the published ci-runner-node by digest; without this entry a node
      # publish never reaches it (the same gap CIIMG-12 closes for node's own FROM).
      - /images/ci-runner-muxwall
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
