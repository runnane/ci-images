name: build images

# This repo is PUBLIC on purpose, and this workflow runs on GitHub-HOSTED runners on
# purpose. Public repos get free unlimited hosted minutes and public GHCR packages are
# free, while the account's 2,000 private-repo minutes are exhausted within days of each
# reset (ANS-315). So this is the one pipeline that must never move to the self-hosted
# runners it builds images for — otherwise a broken runner cannot be fixed by rebuilding
# its own image. Keep `runs-on: ubuntu-latest` here.

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so base-image security updates land on a schedule rather than whenever
  # someone happens to touch the repo. Free — public repo.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Read-only by default; the build job widens this for itself only.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ci-runner-base
          - ci-runner-node
          - ci-runner-muxwall
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Push only when the commit is already on main (or a tag, or a manual/scheduled
      # run). A pull_request build verifies the Containerfile without publishing, and a
      # fork PR gets a read-only token anyway — this makes that explicit rather than
      # relying on the default.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # The immutable sha tag is what humans read; consumers pin by DIGEST.
          tags: |
            type=sha,format=long
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/${{ matrix.image }}
          file: images/${{ matrix.image }}/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          # Also load into the runner's daemon: the layer scan below reads the local
          # image, and a push-only build leaves nothing local to read (CIIMG-14).
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attested separately below, so buildkit's inline provenance is redundant.
          provenance: false

      # Verifiable digest -> workflow -> commit chain. Worth the step precisely because
      # these images execute untrusted dependency code on our own hardware: if something
      # goes wrong we need to know exactly which build produced the running image.
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Runs on every event, pull requests included, so a PR proves the scan can read
      # the image. Scans the LOADED image by id; scripts/scan-layer-history.sh fails
      # on a missing image or an empty history rather than passing on no input.
      - name: Fail if a layer looks like it carries a secret
        run: scripts/scan-layer-history.sh "${{ steps.build.outputs.imageid }}"

      - name: Report the digest to pin
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo
            echo 'Pin this in the ANS runner role — by digest, never by tag:'
            echo
            echo '```'
            echo "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
